# ==========================================================
# Projeto Carros
# Configuração do Banco de Dados
# ==========================================================

# URL da conexão JDBC
db.url=jdbc:mysql://localhost:3306/carros?\
useUnicode=true&\
characterEncoding=UTF-8&\
serverTimezone=UTC&\
useSSL=false&\
allowPublicKeyRetrieval=true

# Driver JDBC
db.driver=com.mysql.cj.jdbc.Driver

# ==========================================================
# Credenciais
# ==========================================================
# Usuário do banco
db.user=carro

# Senha
db.password=carro123

# ==========================================================
# Explicação dos parâmetros da conexão
# ==========================================================
#
# useUnicode=true
#   Garante que o driver trabalhe com caracteres Unicode.
#
# characterEncoding=UTF-8
#   Define UTF-8 como codificação da conexão.
#
# serverTimezone=UTC
#   Evita o erro:
#   "The server time zone value '...' is unrecognized"
#
# useSSL=false
#   Desabilita SSL em ambiente de desenvolvimento.
#
# allowPublicKeyRetrieval=true
#   Evita problemas de autenticação em algumas versões do MySQL 8.
#